name: foundation-ci

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: aio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: '1'

jobs:
  core-ci:
    name: 01-core-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m compileall -q app scripts tests
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Foundation validation
        run: python scripts/validate.py
      - name: Manifest consistency guard
        run: python scripts/manifest_guard.py
      - name: Development learning guard
        run: python scripts/learning_guard.py
      - name: Release evidence guard
        run: python scripts/evidence_guard.py
      - name: Documentation version/status guard
        run: python scripts/documentation_guard.py
      - name: Iteration version/repository sync guard
        run: python scripts/iteration_sync.py --check --require-git --require-clean --expect-commit "$GITHUB_SHA" --output artifacts/iteration-sync.json
      - name: Upload iteration sync evidence
        uses: actions/upload-artifact@v4
        with:
          name: 01-iteration-sync-${{ github.sha }}
          path: artifacts/iteration-sync.json
          if-no-files-found: error
          retention-days: 30
      - name: Launcher syntax
        run: bash -n start_tool.sh start_native_acceptance.sh start_safe_file_simulation.sh
      - name: JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/native-acceptance.js
          node --check web/safe-file-sim.js
      - name: Runtime release build/check
        run: python scripts/release.py --check
      - name: Upload runtime release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: 01-runtime-${{ github.sha }}
          path: dist/AIO-Tool-*-DEV.zip
          if-no-files-found: error
          retention-days: 30

  failure-matrix:
    name: 02-failure-matrix
    needs: core-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute deterministic failure matrix
        run: python scripts/failure_matrix.py --output artifacts/failure-matrix.json
      - name: Upload failure evidence
        uses: actions/upload-artifact@v4
        with:
          name: 02-failure-matrix-${{ github.sha }}
          path: artifacts/failure-matrix.json
          if-no-files-found: error
          retention-days: 30

  source-zip:
    name: 03-source-zip
    needs: failure-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build exact-commit source ZIP
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          mkdir -p dist/source
          archive="dist/source/AIO-Tool-${version}-SOURCE-${GITHUB_SHA}.zip"
          git archive --format=zip --prefix="AIO-Tool-${version}-SOURCE/" -o "$archive" HEAD
          sha256sum "$archive" | tee "$archive.sha256"
      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: 03-source-${{ github.sha }}
          path: dist/source/
          if-no-files-found: error
          retention-days: 30

  recovery-basis:
    name: 04-recovery-basis
    needs: source-zip
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify RECOVERY_BASIS
        run: python scripts/build_recovery_basis.py --check
      - name: Upload RECOVERY_BASIS
        uses: actions/upload-artifact@v4
        with:
          name: 04-recovery-basis-${{ github.sha }}
          path: |
            dist/recovery/RECOVERY_BASIS.zip
            dist/recovery/RECOVERY_BASIS.zip.sha256
          if-no-files-found: error
          retention-days: 30

  portable-build:
    name: 05-portable-build
    needs: recovery-basis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-build.txt
      - name: Install pinned portable builder
        run: python -m pip install -r requirements-build.txt
      - name: Build portable Linux x86_64 package
        run: python scripts/build_portable.py --check
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: 05-portable-linux-x86_64-${{ github.sha }}
          path: |
            dist/portable/*.zip
            dist/portable/*.sha256
          if-no-files-found: error
          retention-days: 30

  portable-smoke:
    name: 06-portable-smoke
    needs: portable-build
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: 05-portable-linux-x86_64-${{ github.sha }}
          path: artifacts/portable
      - name: Portable normal + read-only mirror smoke
        run: python scripts/portable_smoke.py --zip-glob 'artifacts/portable/*.zip' --output artifacts/portable-smoke.json
      - name: Upload portable smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: 06-portable-smoke-${{ github.sha }}
          path: artifacts/portable-smoke.json
          if-no-files-found: error
          retention-days: 30

  chromium:
    name: 07-chromium
    needs: portable-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-ui.txt
      - name: Install pinned UI dependency
        run: python -m pip install -r requirements-ui.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Chromium strict UI gate
        run: python scripts/ui_acceptance_ci.py --browser chromium --strict
      - name: Upload Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 07-chromium-${{ github.sha }}
          path: artifacts/ui-acceptance/
          if-no-files-found: error
          retention-days: 30

  firefox:
    name: 08-firefox
    needs: chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-ui.txt
      - name: Install pinned UI dependency
        run: python -m pip install -r requirements-ui.txt
      - name: Install Firefox and Chromium for final cross-browser helper gate
        run: python -m playwright install --with-deps firefox chromium
      - name: Firefox strict UI gate
        run: python scripts/ui_acceptance_ci.py --browser firefox --strict
      - name: Native Runner and SAFE-FILE cross-browser helper gate
        run: python scripts/aux_ui_acceptance.py
      - name: Upload Firefox and helper evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 08-firefox-${{ github.sha }}
          path: |
            artifacts/ui-acceptance/
            artifacts/aux-ui-acceptance/
          if-no-files-found: error
          retention-days: 30
