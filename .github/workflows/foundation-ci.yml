name: foundation-ci

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: aio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: core-and-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m compileall -q app scripts tests
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Foundation validation
        run: python scripts/validate.py
      - name: Development learning guard
        run: python scripts/learning_guard.py
      - name: Launcher syntax
        run: bash -n start_tool.sh
      - name: JavaScript syntax
        run: node --check web/app.js
      - name: Release builder
        id: release
        shell: bash
        run: |
          set -euo pipefail
          output="$(python scripts/release.py --check)"
          printf '%s\n' "$output"
          status="$(printf '%s\n' "$output" | awk '/^STATUS /{print $2}')"
          test -n "$status"
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Upload runtime release ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AIO-Tool-RUNTIME-${{ steps.release.outputs.status }}-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  ui-acceptance:
    name: ui-acceptance-chromium-firefox
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-ui.txt
      - name: Install pinned UI test dependency
        run: python -m pip install -r requirements-ui.txt
      - name: Install pinned Playwright browsers
        run: python -m playwright install --with-deps chromium firefox
      - name: Browser render, raster and interaction gate
        run: python scripts/ui_acceptance.py --browser chromium --browser firefox --strict
      - name: Upload UI screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AIO-Tool-UI-Acceptance-${{ github.sha }}
          path: artifacts/ui-acceptance/
          if-no-files-found: error
          retention-days: 30
